name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: npm

      - name: Provenance
        # Records exactly what was tested. On a pull_request run HEAD is the
        # synthetic merge commit: parent 1 is the base, parent 2 is the PR head.
        # Parent SHAs come from the commit header, so a depth-1 checkout is enough.
        # The lockfile was generated and verified with npm 10.9.4; fail on any other.
        run: |
          set -euo pipefail
          echo "provenance: head=$(git rev-parse HEAD)"
          n=0
          for p in $(git cat-file -p HEAD | sed -n 's/^parent //p'); do
            n=$((n + 1))
            echo "provenance: parent${n}=${p}"
          done
          echo "provenance: node=$(node --version) npm=$(npm --version)"
          if [ "$(npm --version)" != "10.9.4" ]; then
            echo "provenance: npm $(npm --version) is not the pinned 10.9.4" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Design token lint
        run: ./scripts/lint-design-tokens.sh

      - name: Production dependency audit
        # Blocking on high or critical in anything that ships. No allow-list here.
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (allow-listed)
        # Blocking on high or critical across the whole tree, dev included.
        # Exceptions live in audit-ci.jsonc, each with a written reason,
        # an owner and a review date.
        run: npx --no-install audit-ci --config audit-ci.jsonc
